services:
  - type: web
    name: don-life-content
    env: node
    rootDir: content-api
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: NODE_VERSION
        value: 22
      - key: EDIT_TOKEN
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: don-life-content-db
          property: connectionString

databases:
  - name: don-life-content-db
    plan: free
    databaseName: don_life_content
    ipAllowList: []

# Free-plan internal DB DNS may not resolve. Use the database's External Database URL,
# add inbound IP rule 0.0.0.0/0, then override DATABASE_URL in the service dashboard.
